<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HT Field App</title>
<style>
:root{--bg:#edf2e8;--card:#fbfdf8;--ink:#15251b;--mut:#5f7064;--line:#d3dccd;--acc:#2c7a4b;--on:#fff;--amb:#c9801a;--bad:#b4372a;--tint:rgba(44,122,75,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1912;--card:#17251b;--ink:#e6f0e6;--mut:#94a899;--line:#2b3d2f;--acc:#5fbd85;--on:#0c140e;--tint:rgba(95,189,133,.16);--amb:#e0a24a;--bad:#e2705f}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:480px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:15px;margin:16px 0 8px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
button{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:46px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
button.w{border-color:var(--amb);color:var(--amb);font-weight:700}
button.b{width:100%}button:disabled{opacity:.45}
input,textarea{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--acc)}
.pill.off{background:rgba(180,55,42,.14);color:var(--bad)}
.tm{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--acc);color:var(--on)}.st.PAUSED{background:var(--amb)}
.arches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arch{border:2px solid var(--line);border-radius:48px 48px 8px 8px;padding:20px 8px 8px;background:var(--card)}
.arch b{display:block;text-align:center;font-size:13px;margin-bottom:6px}
.lane{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lane button{padding:8px 0;min-height:40px;font-size:12px;font-weight:700;border-radius:6px;border:1px solid var(--line)}
.s-AVAILABLE{background:var(--card)}.s-POST_HARVEST,.s-TURNOVER,.s-HOLD,.s-UNKNOWN{background:rgba(180,55,42,.14)}.s-OCCUPIED{background:var(--tint)}.s-PRE_PLANTING,.s-RESERVED{background:rgba(201,128,26,.25)}.s-ACTIVE,.s-PLANTED,.s-GROWING{background:var(--tint)}.s-HARVEST_READY,.s-HARVESTING{background:rgba(201,128,26,.5)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{min-height:40px;padding:8px 12px}.chips .on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.act{display:block;width:100%;text-align:left;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:min(480px,100%);max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.err{background:var(--bad);color:#fff;padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:13px}
.link{color:var(--acc);font-weight:700;cursor:pointer;display:inline-block;padding:8px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none}
.top{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.who{flex:1;min-width:0;line-height:1.25}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{min-height:38px;padding:6px 12px;font-size:13px;font-weight:700;flex:none}
.pill{white-space:nowrap}
.qr{display:flex;gap:8px;margin-top:6px}.qr input{flex:1;min-width:0}.qr button{flex:none;padding:0 14px}
.bedgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.bedb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:8px 10px;min-height:52px;font-size:13px}
.bedb .mut{font-size:12px}
.cam video{width:100%;border-radius:12px;background:#000}
.rb{margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--tint);border-left:4px solid var(--amb);font-size:13px}.rb .mut{font-size:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.kv span{display:block;font-size:12px;color:var(--mut)}.kv b{font-size:15px}
</style></head><body>
<div id="app" class="wrap"></div><div id="ov"></div><div id="toast"></div>
<script>
addEventListener('error',e=>{const a=document.getElementById('app');if(a)a.innerHTML='<div class="card"><b>App error</b><pre style="white-space:pre-wrap;font-size:12px">'+String(e.message)+' (line '+e.lineno+')</pre></div>'});
</script>
<script>
const LS=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
/* Login is per browser tab: sessionStorage is wiped when the tab/browser closes, so a new tab always starts at sign-in. */
const SS=(()=>{try{sessionStorage.setItem('_t','1');sessionStorage.removeItem('_t');return sessionStorage}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
['ht-sess','ht-me'].forEach(k=>LS.removeItem(k)); /* drop logins saved by older versions */
const GSR=()=>typeof google!=='undefined'&&!!(google.script&&google.script.run);
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jget=(k,d)=>{try{const v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}},jset=(k,v)=>{try{LS.setItem(k,JSON.stringify(v))}catch(e){}};
const API_URL='https://script.google.com/macros/s/AKfycbxOW7gq6C_jkWB5fVaFsO8sZmCwgsnPOU353own_8i-bPARdx0MGBKRjNO7lAPhZApTVw/exec';
let S={sess:SS.getItem('ht-sess')||'',me:(()=>{try{return JSON.parse(SS.getItem('ht-me'))}catch(e){return null}})(),on:navigator.onLine,view:'home',bed:null,sheet:null,busy:0,err:'',q:'',bq:'',lu:'',lp:'',gate:null};
let DB=jget('ht-db',{beds:{},cohorts:[],tasks:[]}),W=jget('ht-w',{sessions:[],crops:[]}),ob=jget('ht-ob',[]),F={};
const REASONS=['Break','Lunch','End of Day'],DOMS=['Pest pressure','Disease','Plant condition','Soil & water','Weeds'],SEV=['LOW','MEDIUM','HIGH'],ITYPES=['Equipment failure','Safety concern','Bed blocked','Other'];
/* Activities come from the live catalog (ACTIVITY_REFERENCE via getToday -> DB.catalog). Nothing about which activities exist is hard-coded here. */
const CAT=()=>Array.isArray(DB.catalog)?DB.catalog:[],aById=id=>CAT().find(a=>a.id===id),aByName=n=>{n=String(n||'').trim().toLowerCase();return CAT().find(a=>a.name.toLowerCase()===n)};
const aOf=s=>aById(s.actId)||aByName(s.act);
const cntOf=s=>{const a=aOf(s);return a&&a.count?['Count'+(a.unit?' ('+a.unit.toLowerCase()+')':''),a.unit||'']:null};
const isPlant=a=>!!a&&a.beh==='PLANTING',isTote=a=>!!a&&a.beh==='HARVEST_TOTES',isScout=a=>!!a&&/scouting/i.test(a.name);
const isFinal=a=>!!a&&a.type==='INSPECTION'&&!!a.req&&!CAT().some(b=>b.req&&b.pre===a.id);   /* terminal inspection of the turnover chain: needs PASS/FAIL */
const needsBed=a=>!!(a.pre||a.req||['VESTIBULE_ENTRY','VESTIBULE_RELEASE','PLANTING','HARVEST_COMPLETE'].includes(a.beh));
const groups=l=>{const m=[];l.forEach(a=>{const k=a.group||'Other';let g=m.find(x=>x[0]===k);if(!g)m.push(g=[k,[]]);g[1].push(a)});return m};
const SUG={POST_HARVEST:['Turnover Protocol','Biosecurity'],TURNOVER:['Turnover Protocol','Biosecurity'],HOLD:['Turnover Protocol','Biosecurity'],
 AVAILABLE:['Planting Operations','Nursery Operations','Irrigation Management','Fertility & Nutrient Management'],RESERVED:['Nursery Operations','Planting Operations','Irrigation Management'],PRE_PLANTING:['Nursery Operations','Planting Operations','Irrigation Management'],
 ACTIVE:['Crop Care','Irrigation Management','IPM (Pest & Disease)','Fertility & Nutrient Management','Canopy Management','Environmental Control'],OCCUPIED:['Crop Care','Irrigation Management','IPM (Pest & Disease)','Fertility & Nutrient Management','Canopy Management','Environmental Control'],
 HARVEST_READY:['Harvest Operations','Packing Operations','Logistics'],HARVESTING:['Harvest Operations','Packing Operations','Logistics']};
const RG={NURSERY:['Nursery Operations','Biosecurity'],HARVEST_PACKING:['Harvest Operations','Packing Operations','Logistics','Turnover Protocol'],LOGISTICS:['Logistics']};
const roleOK=g=>{const w=(S.me&&S.me.wrole)||'';if(RG[w])return RG[w].includes(g);if(w==='FIELD')return!['Nursery Operations','Harvest Operations','Packing Operations','Logistics'].includes(g);return true};
const blockedMsg=(a,g)=>g.state?'Turnover steps run only after harvest close-out':'Needs first: '+(g.missing||[]).slice(0,2).map(id=>(aById(id)||{name:id}).name).join(', ')+((g.missing||[]).length>2?' +'+((g.missing||[]).length-2):'');
const bedsAll=()=>{const o=[];for(let b=1;b<=6;b++)for(let n=1;n<=6;n++)o.push(`HT-B${b}-0${n}`);return o};
function parseLoc(q){q=String(q||'').trim();
 let m=/(?:^|[^A-Z0-9])(?:HT-?)?B\s*(\d)[-_ ]\s*(\d{1,2})(?!\d)/i.exec(q)||/^(\d)[-_ ](\d{1,2})$/.exec(q);
 if(m){const b=+m[1],n=+m[2];return b>=1&&b<=6&&n>=1&&n<=6?`HT-B${b}-0${n}`:''}
 m=/^(?:HT|T)\s*-?\s*([1-6])$/i.exec(q);return m?'HT'+m[1]:''}
const cohortOn=b=>DB.cohorts.find(c=>c.bed===b&&c.status!=='COMPLETED');
const bst=b=>{const c=cohortOn(b);return c?c.status:(DB.beds[b]&&DB.beds[b].status)||'UNKNOWN'};
const open_=()=>W.sessions.filter(s=>s.status!=='DONE');
const el=s=>(s.end||(s.status==='PAUSED'?s.pauseAt:Date.now()))-s.start-(s.pausedMs||0);
const fmt=ms=>{let s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')};
const sum=a=>(a||[]).reduce((x,y)=>x+y,0),lbs=n=>(Math.round(n*10)/10)+' lb';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function save(){jset('ht-db',DB);jset('ht-w',W);jset('ht-ob',ob)}

/* ---------- API (matches Code_HT.gs: POST text/plain JSON, {ok,error,auth,data,x}) ---------- */
async function call(action,d){const body=JSON.stringify(Object.assign({action,session:S.sess},d));
 if(GSR())return JSON.parse(await new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e)).apiCall(body)));
 const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});return r.json()}
async function api(a,d,q){
 try{const r=await call(a,d);S.on=true;if(!r.ok){if(r.auth)logout(1,r.error);throw r}return r}
 catch(e){if(e&&e.ok===false)throw e;S.on=false;if(q){ob.push({a,d});save();return{ok:true,queued:1}}throw{ok:false,error:'Cannot reach the server ('+((e&&e.message)||'offline')+'). Check signal and try again.'}}}
let fl=0;
async function flush(){if(!S.sess||!ob.length||fl)return;fl=1;
 while(ob.length){try{const r=await call(ob[0].a,ob[0].d);S.on=true;if(!r.ok&&r.auth)break;if(!r.ok)toast(r.error);ob.shift()}catch(e){S.on=false;break}}
 fl=0;save();render()}
async function refresh(){if(!S.sess)return;await flush();if(ob.length)return;
 try{const r=await api('wState');DB=r.data;W=r.x;save();render();if(S.view==='bed'&&/^HT-B/.test(S.bed||''))loadGate(S.bed)}catch(e){render()}}
async function loadGate(b){try{const r=await api('wGate',{bed:b});if(S.bed===b){S.gate=r.x;render()}}catch(e){}}

/* ---------- auth ---------- */
async function login(){const u=S.lu.trim(),p=S.lp;if(!u||!p){S.err='Enter your user name and PIN.';return render()}
 S.busy=1;S.err='';render();
 try{
  const r=await api('login',{userId:u,pin:p,ua:navigator.userAgent.slice(0,160)});
  const own=LS.getItem('ht-owner');if(own&&own!==String(r.user.id)){W={sessions:[],crops:[]};ob=[]}  /* different worker on this device: never inherit the last worker's cache or unsent items */
  LS.setItem('ht-owner',String(r.user.id));S.sess=r.session;S.me=r.user;SS.setItem('ht-sess',S.sess);SS.setItem('ht-me',JSON.stringify(S.me));DB=r.data;save();S.lp='';S.view='home';S.busy=0;await refresh()}
 catch(e){S.busy=0;S.err=e.error||e.message||'Sign in failed.';render()}}
function logout(auto,msg){if(!auto&&ob.length&&!confirm(ob.length+' item(s) have not synced yet and will be lost if a different worker signs in on this device. Log out anyway?'))return;
 if(!auto&&S.sess)call('logout',{}).catch(()=>{});
 S.sess='';S.me=null;S.view='home';S.sheet=null;S.err=msg||'';SS.removeItem('ht-sess');SS.removeItem('ht-me');render()}

/* ---------- session actions (optimistic locally, queued when offline) ---------- */
const sget=id=>W.sessions.find(s=>s.id===id);
function patch(id,p){Object.assign(sget(id),p);save()}
async function wr(a,d){try{await api(a,d,1);if(!ob.length)setTimeout(refresh,300)}catch(e){toast(e.error);await refresh()}}
function start(aid,bed,extra){extra=extra||{};const A=aById(aid)||aByName(aid);if(!A)return toast('That activity is not in the catalog. Refresh and try again.');
 const g=S.gate&&S.gate.bed===bed&&S.gate.blocked&&S.gate.blocked[A.id];if(g)return toast(blockedMsg(A,g));
 const id='S-'+Math.random().toString(36).slice(2,10);
 W.sessions.push({id,bed,act:A.name,actId:A.id,status:'RUNNING',start:Date.now(),pausedMs:0,pauseAt:0,reason:'',crop:extra.crop||'',task:extra.task||'',totes:[]});
 save();S.sheet=null;S.view='home';render();wr('wStart',{id,bed,act:A.name,actId:A.id,crop:extra.crop||'',task:extra.task||''})}
function pickAct(aid){const b=S.bed,A=aById(aid);
 if(isPlant(A)&&!cohortOn(b)){F={q:''};S.sheet={k:'crop',act:aid};return render()}
 start(aid,b)}
function pause(id,reason){patch(id,{status:'PAUSED',pauseAt:Date.now(),reason});S.sheet=null;render();wr('wPause',{id,reason})}
function resume(id){const s=sget(id);patch(id,{status:'RUNNING',pausedMs:(s.pausedMs||0)+Date.now()-s.pauseAt,pauseAt:0,reason:''});render();wr('wResume',{id})}
function done(id){const s0=sget(id),A=aOf(s0),c=cntOf(s0);if(c&&(F.cnt===''||F.cnt==null||isNaN(F.cnt)))return toast('Enter the '+c[0].toLowerCase()+'.');
 if(isFinal(A)&&!F.res)return toast('Record the inspection result: PASS or FAIL.');const s=sget(id),qty=isTote(A)?sum(s.totes):0;
 patch(id,{status:'DONE',end:Date.now(),qty,count:F.cnt||'',unit:c?c[1]:'',pausedMs:s.status==='PAUSED'?(s.pausedMs||0)+Date.now()-s.pauseAt:s.pausedMs,pauseAt:0});
 S.sheet=null;render();wr('wDone',{id,notes:F.notes||'',count:F.cnt===''||F.cnt==null?'':Number(F.cnt),unit:c?c[1]:'',result:F.res||''})}
function addTote(id){const w=parseFloat(F.w);if(!(w>0))return toast('Enter the tote weight in lb.');
 sget(id).totes.push(w);save();F.w='';render();wr('wTote',{id,weight:w})}
async function sendScout(){if(!F.dom||!F.sev)return toast('Pick a domain and a severity.');
 const d={bed:S.bed,domain:F.dom,severity:F.sev,notes:F.notes||'',photo:F.photo||''};S.sheet=null;render();
 try{const r=await api('wScout',d,1);toast(r.queued?'Saved offline. Will sync.':'Finding logged.')}catch(e){toast(e.error)}}
async function sendIssue(){if(!F.type||!F.sev||!(F.notes||'').trim())return toast('Pick a type, a severity and describe the problem.');
 const d={bed:S.bed,type:F.type,severity:F.sev,text:F.notes.trim()};S.sheet=null;render();
 try{const r=await api('wIssue',d,1);toast(r.queued?'Saved offline. Will sync.':'Manager notified.')}catch(e){toast(e.error)}}
function readPhoto(inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);F.photo=c.toDataURL('image/jpeg',.6);URL.revokeObjectURL(u);draw()};im.src=u}

/* ---------- views ---------- */
function go(v,b){S.view=v;if(b)S.bed=b;S.err='';S.q='';S.bq='';S.all=0;if(v==='bed'){S.gate=null;if(/^HT-B/.test(S.bed||''))loadGate(S.bed)}render()}
function hdr(){return`<div class="top"><span class="pill ${S.on?'':'off'}">${S.on?'● Connected':'● Offline'}${ob.length?' · '+ob.length+' to sync':''}</span>
 <div class="who"><b>${esc(S.me.name)}</b><span class="mut">${esc(S.me.role||'Worker')}</span></div>
 <button onclick="logout()">Log Out</button></div>`}
const errB=()=>S.err?`<div class="err">${esc(S.err)}</div>`:'';
function vLogin(){return`<h1>HT Field App</h1><p class="mut">Sign in with your user name and PIN.</p>${errB()}
 <div class="card"><label class="mut">User name</label><input autocapitalize="none" autocomplete="username" value="${esc(S.lu)}" oninput="S.lu=this.value">
 <div style="height:10px"></div><label class="mut">PIN</label><input type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" value="${esc(S.lp)}" oninput="S.lp=this.value" onkeydown="if(event.key==='Enter')login()">
 <button class="p b" style="margin-top:14px" ${S.busy?'disabled':''} onclick="login()">${S.busy?'Signing in…':'Sign in'}</button></div>`}
const about=x=>(x.desc?`<div class="mut" style="margin-top:2px">${esc(x.desc)}</div>`:'')+(x.by?`<div class="mut">Assigned by ${esc(x.by)}</div>`:'');
function reBox(r){try{if(typeof r==='string')r=r?JSON.parse(r):null}catch(e){r=null}
 return r&&r.from?`<div class="rb">↪ Reassigned from <b>${esc(r.from)}</b> to you by ${esc(r.by)}${r.note?' · “'+esc(r.note)+'”':''}<div class="mut">${esc(r.at)}</div></div>`:''}
function card(s){const A=aOf(s),hv=isTote(A),p=s.status==='PAUSED';
 return`<div class="card"><div class="row" style="margin:0"><div><span class="st ${s.status}">${p?'PAUSED · '+esc(s.reason):'RUNNING'}</span>
 <div style="font-weight:700;margin-top:6px">${esc(s.bed)} · ${esc(s.act)}</div>${s.crop?`<div class="mut">Planting ${esc((W.crops.find(c=>c.id===s.crop)||{}).name||s.crop)}</div>`:''}
 ${hv?`<div class="mut">${s.totes.length} totes · ${lbs(sum(s.totes))}</div>`:''}${about(DB.tasks.find(x=>x.id===s.task)||{})}${reBox(s.re)}</div><div class="tm" id="t-${s.id}">${fmt(el(s))}</div></div>
 <div class="row">${p?`<button onclick="resume('${s.id}')">Resume</button>`:`<button onclick="S.sheet={k:'pause',id:'${s.id}'};render()">Pause</button>`}
 ${hv?`<button onclick="F={w:''};S.sheet={k:'tote',id:'${s.id}'};render()">Weigh totes</button>`:''}
 ${isScout(A)?`<button onclick="S.bed='${s.bed}';F={sev:'',notes:'',dom:''};S.sheet={k:'scout'};render()">Log finding</button>`:''}
 <button class="w" onclick="F={notes:'',cnt:'',res:''};S.sheet={k:'done',id:'${s.id}'};render()">Complete</button></div></div>`}
function vHome(){const run=open_(),dn=W.sessions.filter(s=>s.status==='DONE').slice(-5).reverse(),
 as=DB.tasks.filter(t=>t.worker===S.me.name&&t.status==='ASSIGNED'&&!run.some(s=>s.task===t.id));
 return`${hdr()}<div class="bar"><h1 style="margin:0">My sessions</h1><button onclick="refresh()">Refresh</button></div>${errB()}
 ${run.length?run.map(card).join(''):'<p class="mut">Nothing running. Scan a bed to start a task.</p>'}
 ${as.length?`<h2>Assigned to you</h2>`+as.map(t=>{const c=cohortOn(t.bed);return`<div class="card"><span class="st">NEW ASSIGNMENT</span><div style="font-weight:700;font-size:17px;margin-top:6px">${esc(t.act)}</div>${about(t)}${reBox(t.re)}
 <div class="kv"><div><span>Bed</span><b>${esc(String(t.bed).replace(/^HT-/,''))}</b></div><div><span>Cohort</span><b>${esc(c?c.id:'-')}</b></div><div><span>Crop</span><b>${esc(c?(c.cropName||c.crop):'-')}</b></div></div>
 <div class="mut" style="margin-top:6px">Due ${esc(t.date)}</div><button class="p b" style="margin-top:8px" onclick="start('${esc(t.act)}','${esc(t.bed)}',{task:'${esc(t.id)}'})">Start</button></div>`}).join(''):''}
 <button class="p b" style="margin:12px 0" onclick="go('scan')">+ Start new task</button>
 ${dn.length?`<h2>Done recently</h2>`+dn.map(s=>`<div class="card row" style="margin-bottom:6px"><div><b>${esc(s.bed)}</b> <span class="mut">${esc(s.act)}${s.qty?' · '+lbs(s.qty):''}${s.count!==''&&s.count!=null&&s.count!==undefined&&cntOf(s)?' · '+esc(s.count)+' '+esc(s.unit):''}</span></div><div class="mut" style="flex:none">${fmt(el(s))}</div></div>`).join(''):''}`}
const qrOK=()=>'BarcodeDetector' in window&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
function vScan(){return`${hdr()}<h1>Scan Location</h1>${errB()}
 <div class="card"><label class="mut" for="qr">Scan or Enter QR Code</label>
 <div class="qr"><input id="qr" placeholder="HT-B1-01" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(S.q)}" oninput="S.q=this.value" onkeydown="if(event.key==='Enter')scan()">${qrOK()?`<button onclick="camStart()" aria-label="Scan with camera">📷</button>`:''}</div>
 <button class="p b" style="margin-top:10px" onclick="scan()">Process Scan</button></div>
 <div class="card"><h2 style="margin-top:0">Or Search Beds <span class="mut">(no camera needed)</span></h2>
 <input id="bs" placeholder="e.g. HT-B2-03, B2, or 03" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(S.bq)}" oninput="setBq(this.value)">
 <p class="mut" style="margin:8px 0 0">Type a bed ID (HT-B1-01 to HT-B6-06) or block prefix (B1–B6) to search.</p><div id="res">${bedRes()}</div></div>
 <p class="link" onclick="go('home')">‹ Back to My Sessions</p>`}
function scan(){const v=S.q.trim();if(!v){S.err='Scan or enter a code first.';return render()}
 const b=parseLoc(v);if(b)return go('bed',b);S.err=`No location matches "${v}". Use a code like HT-B2-03, or search below.`;render()}
function setBq(v,fill){S.bq=v;if(fill){const i=$('#bs');if(i)i.value=v}const r=$('#res');if(r)r.innerHTML=bedRes()}
function bedRes(){const raw=(S.bq||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!raw)return`<div class="chips">${[1,2,3,4,5,6].map(b=>`<button onclick="setBq('B${b}',1)">B${b}</button>`).join('')}</div>`;
 let q=raw.replace(/^H?T(?=\d|B|$)/,''),all=!q&&/^H?T$/.test(raw);
 if(/^\d$/.test(q)||/^\d{3}$/.test(q))q='B'+q;
 const key=id=>id.slice(3).replace('-',''),/* HT-B2-03 -> B203 */
  hit=bedsAll().filter(id=>all||(/^\d{2}$/.test(q)?key(id).endsWith(q):key(id).startsWith(q))),t=/^B([1-6])$/.exec(q);
 const tun=t?`<button class="act" style="margin-top:10px" onclick="go('bed','HT${t[1]}')"><b>Tunnel ${t[1]}</b> <span class="mut">· tunnel-wide work</span></button>`:'';
 if(!hit.length)return`<p class="mut" style="margin:10px 0 0">No beds match "${esc(S.bq)}". Beds run HT-B1-01 to HT-B6-06.</p>`;
 return tun+`<div class="bedgrid">${hit.map(id=>{const c=cohortOn(id),st=bst(id),sub=c?(c.cropName||c.crop):st==='AVAILABLE'?'Available':st==='POST_HARVEST'||st==='TURNOVER'?'Turnover · not available':st.replace(/_/g,' ').toLowerCase();
  return`<button class="bedb s-${st}" onclick="go('bed','${id}')"><b>${id}</b><span class="mut">${esc(sub)}</span></button>`}).join('')}</div>`}
let camS=null,camT=0;
async function camStart(){let det;
 try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){return toast('Camera scanning is not supported here. Type the code or search below.')}
 try{camS=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('Camera is blocked. Type the code or search below.')}
 const o=document.createElement('div');o.id='camov';o.className='ov';
 o.innerHTML='<div class="sh cam"><h1>Point at the QR code</h1><video id="camv" playsinline muted></video><button class="b" style="margin-top:8px" onclick="camStop()">Cancel</button></div>';
 document.body.appendChild(o);const v=$('#camv');v.srcObject=camS;try{await v.play()}catch(e){}
 camT=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){const t=r[0].rawValue;camStop();S.q=t;scan()}}catch(e){}},400)}
function camStop(){clearInterval(camT);if(camS){camS.getTracks().forEach(t=>t.stop());camS=null}const o=$('#camov');if(o)o.remove()}
function grp(g,a){const bd=(S.gate&&S.gate.bed===S.bed&&S.gate.blocked)||{};return`<h2>${esc(g)}</h2>`+a.map(x=>{const k=bd[x.id];return`<button class="act" ${k?'disabled':''} onclick="pickAct('${x.id}')">${esc(x.name)}${k?`<div class="mut">${esc(blockedMsg(x,k))}</div>`:''}</button>`}).join('')}
function actList(b){if(!CAT().length)return'<p class="mut" style="margin:12px 0">Activity list not loaded yet. Go back to My sessions and tap Refresh.</p>';
 const st=(S.gate&&S.gate.bed===b&&S.gate.state)||bst(b),sg=SUG[st]||[],AL=groups(CAT().filter(a=>roleOK(a.group))),A=AL.filter(g=>sg.includes(g[0])),R=AL.filter(g=>!sg.includes(g[0]));
 return`<p class="mut" style="margin:12px 0 0">Suggested for this bed</p>`+(A.length?A.map(g=>grp(g[0],g[1])).join(''):'<p class="mut">Nothing suggested at this stage for your role.</p>')+(R.length?`<button class="b" style="margin:8px 0" onclick="S.all=!S.all;render()">${S.all?'Hide':'Show'} other activities</button>`+(S.all?R.map(g=>grp(g[0],g[1])).join(''):''):'')}
function vTunnel(){const b=S.bed,run=open_().filter(s=>s.bed===b),L=groups(CAT().filter(a=>!needsBed(a)&&roleOK(a.group)));
 return`${hdr()}<p class="link" onclick="go('scan')">‹ Pick another location</p><h1>Tunnel ${b.slice(2)}</h1><div class="card"><div class="mut">Tunnel-wide work, not tied to one bed.</div>${run.length?`<div class="mut" style="margin-top:6px">You already have ${run.length} running here.</div>`:''}</div>
 <div class="row" style="margin-top:0"><button class="w" onclick="F={type:'',sev:'',notes:''};S.sheet={k:'issue'};render()">Report issue</button></div>${L.length?L.map(g=>grp(g[0],g[1])).join(''):'<p class="mut">No tunnel-wide activities for your role.</p>'}`}
function vBed(){if(/^HT\d$/.test(S.bed))return vTunnel();const b=S.bed,c=cohortOn(b),run=open_().filter(s=>s.bed===b);
 return`${hdr()}<p class="link" onclick="go('scan')">‹ Pick another bed</p><h1>${esc(b)}</h1>
 <div class="card"><div>Status: <b>${esc(((S.gate&&S.gate.bed===b&&S.gate.state)||bst(b)).replace(/_/g,' '))}</b></div>${S.gate&&S.gate.bed===b&&S.gate.turn?`<div class="mut">Turnover ${esc(S.gate.turn.progress)} complete · ${esc(S.gate.turn.phase)}</div>`:''}<div>Crop: ${c?esc(c.cropName||c.crop):'None planted'}</div>${c?`<div class="mut">Cohort ${esc(c.id)}${c.dob?' · planted '+esc(c.dob):''}</div>`:''}
 ${run.length?`<div class="mut" style="margin-top:6px">You already have ${run.length} running here.</div>`:''}</div>
 <div class="row" style="margin-top:0"><button onclick="F={sev:'',notes:'',dom:''};S.sheet={k:'scout'};render()">Log scout finding</button><button class="w" onclick="F={type:'',sev:'',notes:''};S.sheet={k:'issue'};render()">Report issue</button></div>
 ${actList(b)}`}

/* ---------- sheets ---------- */
function chips(list,key,cur){return`<div class="chips">${list.map(x=>`<button class="${cur===x?'on':''}" onclick="F.${key}='${x}';draw()">${x}</button>`).join('')}</div>`}
function cropList(){const q=(F.q||'').toLowerCase();return W.crops.filter(c=>!q||(c.name+c.id).toLowerCase().includes(q)).map(c=>`<button class="act" onclick="start('${esc(S.sheet.act)}',S.bed,{crop:'${esc(c.id)}'})"><b>${esc(c.name)}</b> <span class="mut">${c.min}–${c.max} days to harvest</span></button>`).join('')||'<p class="mut">No crop found.</p>'}
function sheet(){const k=S.sheet.k,s=S.sheet.id?sget(S.sheet.id):null;let h='';
 if(k==='crop')h=`<h1>What is being planted in ${esc(S.bed)}?</h1><input placeholder="Search crops" value="${esc(F.q)}" oninput="F.q=this.value;$('#cl').innerHTML=cropList()"><div id="cl" style="margin-top:8px">${cropList()}</div>`;
 if(k==='pause')h=`<h1>Pause for…</h1>`+REASONS.map(r=>`<button class="act" onclick="pause('${s.id}','${r}')">${r}</button>`).join('');
 if(k==='tote')h=`<h1>Weigh totes · ${esc(s.bed)}</h1><div class="row" style="margin:0"><input type="number" inputmode="decimal" step="0.1" placeholder="Weight (lb)" autofocus value="${esc(F.w)}" oninput="F.w=this.value" onkeydown="if(event.key==='Enter')addTote('${s.id}')"><button class="p" style="flex:none" onclick="addTote('${s.id}')">Add tote</button></div>
  <div class="card" style="margin-top:10px"><b>Total ${lbs(sum(s.totes))}</b> <span class="mut">· ${s.totes.length} totes</span>${s.totes.map((w,i)=>`<div class="mut">Tote ${i+1}: ${lbs(w)}</div>`).join('')}</div>`;
 if(k==='done')h=`<h1>Complete ${esc(s.act)}?</h1>${isFinal(aOf(s))?`<label class="mut">Inspection result</label>${chips(['PASS','FAIL'],'res',F.res)}`:''}${isTote(aOf(s))?`<p>Harvest total: <b>${lbs(sum(s.totes))}</b> from ${s.totes.length} totes.</p>${s.totes.length?'':'<p class="mut">No totes weighed yet.</p>'}`:''}${cntOf(s)?`<label class="mut">${esc(cntOf(s)[0])}</label><input type="number" inputmode="decimal" placeholder="${esc(cntOf(s)[1])}" value="${esc(F.cnt)}" oninput="F.cnt=this.value" style="margin-bottom:8px">`:''}<textarea rows="3" placeholder="Notes (optional)" oninput="F.notes=this.value">${esc(F.notes)}</textarea><button class="p b" style="margin-top:10px" onclick="done('${s.id}')">Confirm complete</button>`;
 if(k==='scout')h=`<h1>Scout finding · ${esc(S.bed)}</h1><label class="mut">Domain</label>${chips(DOMS,'dom',F.dom)}<label class="mut">Severity</label>${chips(SEV,'sev',F.sev)}
  <textarea rows="3" placeholder="What did you see?" oninput="F.notes=this.value">${esc(F.notes)}</textarea><div style="margin-top:8px"><label class="mut">Photo</label><input type="file" accept="image/*" capture="environment" onchange="readPhoto(this)">${F.photo?'<div class="mut">Photo attached.</div>':''}</div>
  <button class="p b" style="margin-top:10px" onclick="sendScout()">Save finding</button>`;
 if(k==='issue')h=`<h1>Report an issue · ${esc(S.bed)}</h1><label class="mut">Type</label>${chips(ITYPES,'type',F.type)}<label class="mut">Severity</label>${chips(SEV,'sev',F.sev)}
  <textarea rows="3" placeholder="Describe the problem" oninput="F.notes=this.value">${esc(F.notes)}</textarea><button class="p b" style="margin-top:10px" onclick="sendIssue()">Send to manager</button>`;
 return`<div class="ov" onclick="if(event.target===this){S.sheet=null;render()}"><div class="sh" role="dialog">${h}<button class="b" style="margin-top:8px" onclick="S.sheet=null;render()">Close</button></div></div>`}
function draw(){$('#ov').innerHTML=S.sheet?sheet():''}
function render(){const a=$('#app');
 a.innerHTML=!S.sess?vLogin():S.view==='scan'?vScan():S.view==='bed'?vBed():vHome();draw()}
setInterval(()=>{open_().forEach(s=>{const e=document.getElementById('t-'+s.id);if(e)e.textContent=fmt(el(s))})},1000);
setInterval(()=>{const f=document.activeElement;if(S.sess&&!document.hidden&&!S.sheet&&!(f&&/^(INPUT|TEXTAREA)$/.test(f.tagName)))refresh()},30000);
addEventListener('online',()=>{S.on=true;refresh()});addEventListener('offline',()=>{S.on=false;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
render();if(S.sess)refresh();
</script></body></html>
